<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weight Loss Predictor</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      display: block;
      margin: 12px 0 4px;
      color: #555;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      background-color: #007BFF;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      color: green;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Weight Loss Predictor</h2>
    <form id="weightLossForm">
      <label for="height">Height (cm):</label>
      <input type="number" id="height" required>

      <label for="weight">Weight (kg):</label>
      <input type="number" id="weight" required>

      <label for="age">Age:</label>
      <input type="number" id="age" required>

      <label for="duration">Exercise Duration (min/day):</label>
      <input type="number" id="duration" required>

      <label for="days">Number of Days Exercised:</label>
      <input type="number" id="days" required>

      <label for="sex">Sex:</label>
      <select id="sex" required>
        <option value="">--Select--</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>

      <label for="type">Type of Exercise:</label>
      <select id="type" required>
        <option value="">--Select--</option>
        <option value="Cardio">Cardio</option>
        <option value="Strength">Strength</option>
        <option value="Flexibility">Flexibility</option>
      </select>

      <button type="submit">Predict Weight Loss</button>
    </form>

    <div class="result" id="result"></div>
  </div>

  <script>
    function predictWeightLoss(input) {
      const coefficients = {
        sex_Male: 0.205,
        exerciseType_Cardio: 0.476,
        exerciseType_Flexibility: -0.284,
        height: 0.0029,
        weight: -0.0016,
        age: -0.0078,
        exerciseDuration: 0.014,
        daysPerformed: 0.0102,
        intercept: 0
      };

      const sex_Male = input.sex === "Male" ? 1 : 0;
      const exerciseType_Cardio = input.exerciseType === "Cardio" ? 1 : 0;
      const exerciseType_Flexibility = input.exerciseType === "Flexibility" ? 1 : 0;

      const weightLoss =
        coefficients.sex_Male * sex_Male +
        coefficients.exerciseType_Cardio * exerciseType_Cardio +
        coefficients.exerciseType_Flexibility * exerciseType_Flexibility +
        coefficients.height * input.height +
        coefficients.weight * input.weight +
        coefficients.age * input.age +
        coefficients.exerciseDuration * input.exerciseDuration +
        coefficients.daysPerformed * input.daysPerformed +
        coefficients.intercept;

      return weightLoss;
    }

    document.getElementById("weightLossForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const input = {
        height: parseFloat(document.getElementById("height").value),
        weight: parseFloat(document.getElementById("weight").value),
        age: parseInt(document.getElementById("age").value),
        exerciseDuration: parseFloat(document.getElementById("duration").value),
        daysPerformed: parseInt(document.getElementById("days").value),
        sex: document.getElementById("sex").value,
        exerciseType: document.getElementById("type").value
      };

      const result = predictWeightLoss(input);
      document.getElementById("result").innerText = 
        `Predicted Weight Loss: ${result.toFixed(2)} kg`;
    });
  </script>
</body>
</html>
